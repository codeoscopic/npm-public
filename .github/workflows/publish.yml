name: Publish package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@codeoscopic"

      - name: Cache Turborepo
        id: turbo-cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-

      - name: Install packages
        run: npm ci

      - name: Build packages
        run: npm run build

      # scripts/publish.mjs skips versions that are already published, so
      # re-running this job finishes a release that failed halfway.
      - name: Publish packages (release)
        run: npm run publish
        if: "!github.event.release.prerelease"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases of 2.x go to the `next-2` dist-tag: `latest` stays on the
      # last stable version, and `next` on main's pre-releases (npm 10 would tag
      # a pre-release `latest`, and npm 11 refuses to publish one without a tag).
      - name: Publish packages (next-2)
        run: npm run publish -- --tag=next-2
        if: github.event.release.prerelease
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
