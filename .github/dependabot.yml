version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "kind/chore"
    groups:
      # @tsdown/css peers on an exact tsdown version, so they must be bumped together.
      tsdown:
        patterns:
          - "tsdown"
          - "@tsdown/*"
