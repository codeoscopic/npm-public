version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "kind/chore"
    groups:
      # @tsdown/css peers on an exact tsdown version, so they must be bumped together.
      tsdown:
        patterns:
          - "tsdown"
          - "@tsdown/*"
    # Matches developers' npm `min-release-age` (7 days), so `npm ci` can install
    # the proposed versions locally.
    cooldown:
      default-days: 7
